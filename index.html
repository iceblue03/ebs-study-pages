.learning-top { position: relative; margin-bottom: var(--top-row-gap); }
.learning-top .learning-row { margin-bottom: 0; }
.course-panel {
  margin-top: 20px;
  animation: enter .3s cubic-bezier(.2,.7,.2,1) both;
}
.course-filter {
  position: absolute;
  inset-inline: 0;
  bottom: calc(100% + 8px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  animation: filter-arrive .32s cubic-bezier(.2,.7,.2,1) both;
}
.course-filter .extra-label { margin: 0 5px 0 0; }
.course-filter button {
  min-height: 30px;
  padding: 4px 12px;
  border-color: transparent;
  border-radius: 20px;
  font-size: 12px;
  background: #f5f5f5;
}
.course-filter button[aria-pressed="true"] { background: #313131; color: white; }
@keyframes filter-arrive {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.course-pair {
  display: grid;
  grid-template-columns: minmax(0,2fr) minmax(0,3fr);
  align-items: stretch;
  min-height: var(--top-row-height);
  gap: 20px;
}
.course-pair:nth-child(even) {
  grid-template-columns: minmax(0,3fr) minmax(0,2fr);
}
.course-results { display: grid; grid-auto-rows: 1fr; gap: 12px; }
.course-pair .lecture-card { min-width: 0; overflow-wrap: anywhere; }
.book-select { position: absolute; inset: 0; width: 100%; border: 0; border-radius: inherit; background: transparent; }
.book-select:hover { background: #00000008; }
html { scrollbar-gutter: stable; }
@media (max-width:700px) {
  .course-filter { bottom: calc(100% + 3px); }
  .course-filter button { min-height: 26px; padding: 2px 8px; }
  .course-pair { gap: 9px; min-height: 155px; }
}
.content-card.media-card {
  display: block;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: 0;
  background: transparent;
  perspective: 850px;
}
.media-card:active { transform: none; }
.flip-inner {
  display: grid;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .64s cubic-bezier(.26,.76,.24,1);
}
.media-card[aria-pressed="true"] .flip-inner { transform: rotateY(180deg); }
@media (hover:hover) {
  .media-card:hover .flip-inner { transform: rotateY(180deg); }
}
.flip-face {
  grid-area: 1 / 1;
  display: flex;
  flex-direction: column;
  justify-content: end;
  min-width: 0;
  min-height: 182px;
  border: 1px solid #ccc;
  border-radius: inherit;
  overflow: hidden;
  padding: 13px;
  text-align: left;
  backface-visibility: hidden;
}
.flip-inner { border-radius: inherit; }
.poster-front { position: relative; isolation: isolate; color: white; background: #484848; }
.poster-front::before, .poster-front::after { content: ''; position: absolute; inset: 0; z-index: -1; }
.poster-front::after { background: linear-gradient(transparent 30%,#111e 100%); }
.poster-forest::before {
  background: radial-gradient(circle at 68% 26%,#eee 0 9%,transparent 9.5%),
    linear-gradient(155deg,transparent 49%,#414141 50% 66%,transparent 67%) 0 100% / 72% 89% no-repeat,
    linear-gradient(213deg,transparent 43%,#606060 44% 73%,transparent 74%),
    linear-gradient(#b5b5b5,#616161);
}
.poster-train::before {
  background: radial-gradient(ellipse at 65% 34%,#eee 0 5%,#929292 6%,transparent 32%),
    repeating-linear-gradient(112deg,#1d1d1d 0 15%,#737373 16% 18%,#3e3e3e 19% 28%);
}
.poster-moon::before {
  background: radial-gradient(circle at 62% 34%,#eee 0 15%,transparent 15.5%),
    radial-gradient(ellipse at 23% 89%,#898989 0 38%,transparent 39%),
    linear-gradient(150deg,#222,#777);
}
.poster-city::before {
  background: repeating-linear-gradient(0deg,transparent 0 8px,#454545 8px 11px) 0 0 / 100% 100%,
    repeating-linear-gradient(110deg,#555 0 16%,#aaa 16% 21%,#3a3a3a 21% 31%);
}
.poster-pencil::before {
  background: repeating-linear-gradient(130deg,transparent 0 16px,#eee 17px 20px,transparent 21px 30px),
    radial-gradient(circle at 66% 32%,#ddd 0 16%,#777 17% 29%,#414141 30%);
}
.poster-front strong, .poster-back strong { font-size: 16px; line-height: 1.25; word-break: keep-all; }
.poster-front small, .poster-back small { font-size: 11px; margin-bottom: 5px; }
.poster-back { justify-content: center; transform: rotateY(180deg); color: #222; background: #f3f3f3; }
.content-card .poster-back .poster-description { margin-top: 7px; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
@media (max-width:700px) {
  .flip-face { min-height: 0; padding: 8px; }
  .poster-front strong, .poster-back strong { font-size: 13px; }
  .content-card .poster-back .poster-description { font-size: 11px; }
}

.lecture-card.book-card, .lecture-card.lesson-card {
  display: grid;
  grid-template-columns: minmax(0,1fr) clamp(62px,24%,108px);
  align-items: center;
  gap: 8px;
  background: linear-gradient(128deg,#fff 43%,#f5f5f5);
}
.card-copy { align-self: start; min-width: 0; }
.card-copy p { overflow-wrap: anywhere; }
.course-art { position: relative; display: grid; place-items: center; height: 105px; }
.course-art::before {
  content: '';
  position: absolute;
  width: 85%;
  height: 13px;
  bottom: 6px;
  border-radius: 50%;
  background: radial-gradient(ellipse,#0003,transparent 70%);
}
.textbook {
  position: relative;
  display: grid;
  align-content: space-between;
  justify-items: start;
  width: 61px;
  height: 81px;
  padding: 9px 7px 8px 12px;
  border-radius: 3px 5px 5px 2px;
  border: 1px solid #343434;
  background: linear-gradient(90deg,#343434 0 9%,#777 10%,#555 14%,#505050 15%,#696969);
  box-shadow: 2px 2px #eee, 4px 4px #aaa, 5px 6px #505050, 8px 9px 10px #0003;
  color: white;
  transform: perspective(250px) rotateY(-17deg) rotateZ(-8deg);
}
.textbook strong { font-size: 14px; }
.textbook small { font-size: 8px; letter-spacing: .06em; }
.textbook i {
  width: 25px;
  height: 21px;
  border: 1px solid #ddd;
  border-radius: 50% 50% 3px 50%;
  transform: rotate(-15deg);
}
.lesson-object { position: relative; width: 60px; height: 60px; animation: object-float 3.8s ease-in-out infinite; }
.lesson-object::before, .lesson-object::after { content: ''; position: absolute; }
.object-math {
  border: 3px solid #595959;
  border-radius: 50%;
  background: linear-gradient(145deg,#f7f7f7,#bfbfbf);
  box-shadow: 3px 4px 0 #999;
}
.object-math::before { width: 90%; left: 5%; top: 56%; border-top: 2px solid #555; transform: rotate(-25deg); }
.object-math::after { width: 7px; height: 7px; border-radius: 50%; background: #444; left: 45%; top: 44%; }
.object-english::before, .object-english::after {
  display: grid;
  place-items: center;
  border: 1px solid #666;
  border-radius: 13px 13px 13px 3px;
  width: 42px;
  height: 30px;
}
.object-english::before { content: '…'; bottom: 7px; right: 0; background: #747474; color: white; }
.object-english::after { content: '가'; top: 7px; left: 0; background: #eee; font-weight: bold; }
.object-science {
  width: 53px;
  height: 49px;
  border: 12px solid #636363;
  border-top: 0;
  border-radius: 0 0 24px 24px;
  transform: rotate(-23deg);
}
.object-science::before, .object-science::after { top: 0; width: 12px; height: 11px; background: #c5c5c5; }
.object-science::before { left: -12px; }
.object-science::after { right: -12px; }
@keyframes object-float {
  0%,100% { translate: 0 2px; }
  50% { translate: 0 -5px; }
}
@media (max-width:700px) {
  .lecture-card.book-card, .lecture-card.lesson-card { grid-template-columns: minmax(0,1fr); grid-template-rows: auto 48px; align-content: start; gap: 3px; }
  .course-art { height: 48px; }
  .course-art::before { width: 65px; bottom: 0; }
  .textbook { scale: .53; }
  .lesson-object { scale: .63; }
  .course-art:has(.textbook) { align-items: start; }
  .textbook { margin-top: -16px; }
}

.streak-callout {
  display: grid;
  grid-template-columns: 94px minmax(0,1fr);
  align-items: center;
  gap: 12px;
  min-height: 116px;
}
.streak-callout p { margin: 0; line-height: 1.6; }
.streak-callout strong { display: block; margin-top: 5px; font-size: 17px; }
.streak-art {
  position: relative;
  width: 94px;
  height: 111px;
  isolation: isolate;
}
.streak-art::before {
  content: '';
  position: absolute;
  inset: 9px 0 11px;
  border-radius: 50%;
  background: radial-gradient(ellipse,#aaa7,transparent 66%);
}
.streak-art::after {
  content: '';
  position: absolute;
  inset: auto 15px 3px;
  height: 11px;
  border-radius: 50%;
  background: radial-gradient(ellipse,#20202059,transparent 70%);
  z-index: -1;
}
.streak-flame {
  position: absolute;
  inset: 0 0 6px;
  width: 100%;
  height: calc(100% - 6px);
  overflow: visible;
  transform-origin: 50% 93%;
  filter: drop-shadow(1px 4px 4px #0003);
}
.streak-flame-shapes {
  transform-origin: 55px 111px;
  transform: skewX(var(--flame-tip-bend,0deg)) scaleY(var(--flame-tip-stretch,1));
}
.streak-flame-warm-shell { opacity: var(--shell-heat,0); }
.streak-flame-warm-ember { opacity: var(--ember-heat,0); }
.streak-flame[data-lit="true"] { --shell-heat: 1; --ember-heat: 1; }
.streak-callout[data-lit="false"] .streak-flame { filter: drop-shadow(0 5px 5px #846fbe30); }
@media (max-width:700px) {
  .streak-callout { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .streak-art { justify-self: center; margin-block: -15px; --flame-button-scale: .72; }
  .streak-callout strong { font-size: 13px; }
}

.course-art {
  transform: perspective(350px) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));
  transition: transform .24s cubic-bezier(.2,.75,.28,1);
}
.flame-body {
  position: absolute;
  inset: 0;
  transform-origin: center 88%;
  transform: translateY(var(--lift,0px));
  transition: transform .42s cubic-bezier(.22,.8,.25,1);
}
.streak-callout[data-lit="false"] .streak-art { cursor: grab; touch-action: none; user-select: none; }
.streak-art[data-grabbing] { cursor: grabbing !important; }
.streak-art:is([data-grabbing],[data-falling],[data-previewing]) .flame-body { transition: none; }
.streak-art:focus-visible { outline: 2px solid #555; outline-offset: 3px; border-radius: 12px; }

.mesh-host > canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
.course-art.mesh-host > canvas { inset: auto; width: min(100%,105px); height: auto; aspect-ratio: 1; }
.mesh-host > .textbook, .mesh-host > .lesson-object { display: none; }
@media (max-width:700px) {
  .course-art.mesh-host > canvas { width: 56px; }
}

.shell.screen { animation-name: screen-fade; }
@keyframes screen-fade { from { opacity: 0; } to { opacity: 1; } }
.content-row { grid-auto-rows: minmax(0, 1fr); }
.learning-row { grid-template-rows: minmax(0, 1fr); }
.learning-row .lecture-card { min-width: 0; }
.learning-row .card-copy p { margin-bottom: 11px; }
.quiz-panel { border: 1px solid #bbb; border-radius: 20px; padding: 23px; background: #fafafa; }
.quiz-panel .block-title { margin: 8px 0 12px; }
.quiz-topic { color: #666; font-size: 13px; margin: 0 0 18px; }
.quiz-panel fieldset { border: 0; margin: 0; padding: 0; min-inline-size: 0; }
.quiz-panel legend { font-weight: 700; margin-bottom: 12px; padding: 0; line-height: 1.5; }
.quiz-options { display: grid; gap: 8px; }
.quiz-option { display: flex; gap: 9px; align-items: center; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
.quiz-option:has(input:checked) { border-color: #444; background: #eee; }
.quiz-option input { flex: none; accent-color: #333; }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
.quiz-actions .primary { padding: 10px 14px; }
.quiz-feedback { flex: 1 1 160px; line-height: 1.45; font-size: 14px; margin: 0; }
@media (max-width:700px) {
  .learning-row .lecture-card { grid-template-rows: auto 40px; }
  .learning-row .card-copy p { margin-block: 5px 8px; }
  .learning-bottom { grid-template-columns: minmax(0,1fr); }
  .quiz-panel { padding: 17px; }
}

.streak-art::before { background: radial-gradient(ellipse,#b8b8b84d,transparent 68%); }
.streak-callout[data-lit="true"] .streak-art::before {
  background: radial-gradient(ellipse,#ffbd637a 8%,#ffc88250 41%,transparent 72%);
  opacity: var(--flame-glow,1);
}
.streak-callout[data-igniting] .streak-flame { filter: drop-shadow(0 4px 5px #3335); }
.streak-roll { display: inline-flex; align-items: baseline; vertical-align: baseline; }
.streak-roll-window { display: inline-block; height: 1.15em; overflow: hidden; line-height: 1.15; }
.streak-roll-wheel { display: block; transform: translateY(var(--day-roll,0%)); }
.streak-roll-wheel > span { display: block; }
.metrics .streak-roll, .metrics .streak-roll span { font-size: inherit; color: inherit; }

.streak-callout[data-lit="true"] .streak-flame { filter: drop-shadow(0 4px 7px #f08d2a48); }
.streak-flame-ember-shape { transform-origin: 55px 90px; }
.streak-spark { opacity: 0; transform-box: fill-box; transform-origin: center; }
.streak-callout[data-lit="true"]:not([data-igniting]) .streak-flame-shell-shape {
  animation: flame-shell-flow 1.32s cubic-bezier(.44,.05,.49,.96) infinite;
}

<body>
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div><div id="modal"></div>
<script>
const courses=[{title:'중학 수학 마스터 개념 3-2',subject:'수학',lesson:'원과 현, 원만큼 중요한 도형이 또 있을까?',chapter:19,teacher:'정승제',duration:30},{title:'중학 영어 문법 2',subject:'영어',lesson:'현재완료의 의미와 쓰임',chapter:8,teacher:'정승익',duration:25},{title:'중학 과학 개념 3',subject:'과학',lesson:'전류와 자기장의 관계',chapter:12,teacher:'안현정',duration:28}];
const state={screen:'home',selected:0,expanded:false,subject:'',book:false,page:1,completed:new Set(),ignitePending:false,quizAnswered:new Map(),quizReview:new Set()};
const app=document.querySelector('#app');const modal=document.querySelector('#modal');const label='<span class="extra-label">스케치 외 요소</span>';let toastTimer;
function toast(text='미구현'){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),1800)}
function logo(){return '<header class="brand">EBS</header>'}
function go(screen){if(state.screen==='player')disposeExampleVideo();state.screen=screen;render();window.scrollTo({top:0,behavior:'instant'})}
const homeMedia = [
  { category: '다큐멘터리', title: '숲이 깨어나는 시간', art: 'forest', description: '새벽 안개가 걷히는 산골에서 숲의 하루를 따라갑니다.' },
  { category: '영화', title: '마지막 기차', art: 'train', description: '막차를 놓친 두 사람이 낯선 역에서 하룻밤을 보냅니다.' },
  { category: '애니메이션', title: '달의 정원', art: 'moon', description: '작은 토끼가 달빛 아래에서 사라진 씨앗을 찾아 나섭니다.' },
  { category: '교양', title: '도시의 뒷면', art: 'city', description: '매일 지나치는 골목과 건물에 담긴 이야기를 살펴봅니다.' },
  { category: '어린이', title: '연필 탐험대', art: 'pencil', description: '친구들과 함께 그림을 그리고 신나는 모험을 떠나요.' }
];

function homeMediaCards() {
  return homeMedia.map(({ category, title, art, description }, index) => `
    <button class="content-card media-card" type="button" aria-label="${category} · ${title} 설명" aria-describedby="media-description-${index}" aria-pressed="false" onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') !== 'true')">
      <span class="flip-inner">
        <span class="flip-face poster-front poster-${art}" aria-hidden="true">
          <small>${category}</small>
          <strong>${title}</strong>
        </span>
        <span class="flip-face poster-back">
          <small>${category}</small>
          <strong>${title}</strong>
          <span class="poster-description" id="media-description-${index}">${description}</span>
        </span>
      </span>
    </button>`).join('');
}

const shortcutLabels = { schedule: '편성표', programs: '방송 프로그램', lessons: '강의 학습' };
const sampleSchedule = [
  [['08:30',0],['11:10',4],['16:20',2],['20:00',3]],
  [['09:00',4],['13:30',3],['17:50',0],['21:20',1]]
];

function shortcutContent(menu, day = 0) {
  if (menu === 'schedule') return `<div><h2>예시 편성표</h2><p>시간대별 방송 프로그램을 확인해 보세요.</p>
    <div class="shortcut-days" role="group" aria-label="편성 날짜">${['오늘','내일'].map((name,index) => `<button type="button" aria-pressed="${day === index}" onclick="showShortcutDay(${index},this)">${name}</button>`).join('')}</div>
    <table class="shortcut-table"><thead><tr><th scope="col">시간</th><th scope="col">프로그램</th><th scope="col">분류</th></tr></thead>
    <tbody>${sampleSchedule[day].map(([time,index]) => `<tr><td>${time}</td><td>${homeMedia[index].title}</td><td>${homeMedia[index].category}</td></tr>`).join('')}</tbody></table></div>`;
  if (menu === 'programs') return `<div><h2>방송 프로그램</h2><div class="shortcut-programs">${homeMedia.map(item =>
    `<article><span>${item.category}</span><strong>${item.title}</strong><p>${item.description}</p></article>`).join('')}</div></div>`;
  if (menu === 'lessons') return `<div><h2>강의 학습</h2><p>과목을 선택해 학습 화면을 열어요.</p><div class="shortcut-lessons">${courses.map((course,index) =>
    `<button class="shortcut-action" type="button" onclick="selectCourse(${index});go('learn')"><span>${course.title}<small>${course.subject} · ${course.chapter}강</small></span><span aria-hidden="true">›</span></button>`).join('')}</div></div>`;
  return '';
}

function toggleShortcut(key, button) {
  const shell = button.closest('.home-shell');
  const panel = shell.querySelector('#shortcut-detail');
  const opening = shell.dataset.shortcutOpen !== key;
  if (opening) shell.dataset.shortcutOpen = key;
  else delete shell.dataset.shortcutOpen;
  shell.querySelectorAll('.shortcut-key').forEach(item =>
    item.setAttribute('aria-expanded',String(opening && item === button)));
  panel.innerHTML = opening ? shortcutContent(key) : '';
  panel.hidden = !opening;
}

function showShortcutDay(day, button) {
  const panel = button.closest('#shortcut-detail');
  panel.innerHTML = shortcutContent('schedule',day);
  panel.querySelector('.shortcut-days [aria-pressed="true"]').focus({ preventScroll: true });
}

function home() {
  return `<div class="shell screen home-shell">${logo()}
    <section class="home-top" aria-label="콘텐츠">
      <div class="content-row extra">${label}<style>.content-row>.extra-label{position:absolute;top:-22px;left:0}</style>
        <button class="content-card" onclick="go('learn')"><span class="card-symbol" aria-hidden="true">▤</span><span>학습</span></button>
        ${homeMediaCards()}
      </div>
    </section>
    <section class="home-bottom">
      <div class="banner placeholder" role="img" aria-label="배너 이미지 자리"></div>
      <aside class="shortcuts">
        <h1 class="block-title">바로가기</h1>
        <div class="shortcut-menu extra">${label}${Object.entries(shortcutLabels).map(([key,name]) =>
          `<button type="button" class="shortcut-key" aria-controls="shortcut-detail" aria-expanded="false" onclick="toggleShortcut('${key}',this)">${name}</button>`).join('')}</div>
        <section class="shortcut-detail" id="shortcut-detail" aria-label="바로가기 상세" hidden></section>
      </aside>
    </section></div>`;
}

function courseCards(index, inPanel = false, reversed = false) {
  const course = courses[index];
  const object = ['math', 'english', 'science'][index];
  const bookAction = inPanel ? `<button class="book-select" aria-label="${course.title} 선택" onclick="chooseBook(${index})"></button>` : '';
  const lectureAction = inPanel ? `openCourse(${index})` : "go('player')";
  const bookCard = `
    <article class="lecture-card extra book-card">
      <div class="card-copy">
        ${label}
        <h2>${course.title}</h2>
        <p>${course.chapter}강 · ${course.subject}</p>
      </div>
      <div class="course-art" data-model="book" data-cover="${course.subject}" aria-hidden="true">
        <span class="textbook"><strong>${course.subject}</strong><i></i><small>중학 개념</small></span>
      </div>
      ${bookAction}
    </article>`;
  const lessonCard = `
    <article class="lecture-card extra lesson-card">
      <div class="card-copy">
        ${label}
        <h2>강의 학습 중</h2>
        <p>${course.chapter}강 ${course.lesson}</p>
        <button class="primary" onclick="${lectureAction}">이어서 학습</button>
      </div>
      <div class="course-art" data-model="${object}" aria-hidden="true"><span class="lesson-object object-${object}"></span></div>
    </article>`;
  return reversed ? lessonCard + bookCard : bookCard + lessonCard;
}

const subjects = ['', ...new Set(courses.map(course => course.subject))];

function courseResults() {
  const visible = courses
    .map((course, index) => ({ subject: course.subject, index }))
    .filter(course => !state.subject || course.subject === state.subject);
  return visible.map(({ index }, row) =>
    `<div class="course-pair">${courseCards(index, true, row % 2 === 1)}</div>`
  ).join('');
}

function courseFilter() {
  return `
    <div class="course-filter" id="courseFilter" role="group" aria-label="과목 필터" ${state.expanded ? '' : 'hidden'}>
      ${label}
      ${subjects.map((subject, index) => `<button type="button" data-filter="${index}" aria-pressed="${subject === state.subject}" onclick="filterCourses(${index})">${subject || '전체'}</button>`).join('')}
    </div>`;
}

function coursePanel() {
  return `
    <section class="course-panel" id="coursePanel" aria-label="강의 선택" ${state.expanded ? '' : 'hidden'}>
      <div class="course-results" id="courseResults">${courseResults()}</div>
    </section>`;
}

function quizContent(enter = false) {
  const course = courses[state.selected];
  const set = quizSets[state.selected];
  const count = state.quizAnswered.get(state.selected) || 0;
  if (state.quizReview.has(state.selected)) return quizCelebration(set[count-1],count,set.length);
  const quiz = set[count];
  return `${label}
    <div class="${enter ? 'quiz-question-arrive' : ''}">
      <h2 class="block-title" id="quiz-title" tabindex="-1">오늘의 확인 퀴즈</h2>
      <p class="quiz-topic">${course.subject} · ${course.chapter}강 · ${count+1} / ${set.length} 문제</p>
      <form onsubmit="checkQuiz(event)">
        <fieldset>
          <legend id="quiz-question" tabindex="-1">${quiz.question}</legend>
          <div class="quiz-options">
            ${quiz.choices.map((choice,index) => `<label class="quiz-option"><input type="radio" name="answer" value="${index}" required><span>${choice}</span></label>`).join('')}
          </div>
        </fieldset>
        <div class="quiz-actions">
          <button class="primary" type="submit">정답 확인</button>
          <p class="quiz-feedback" id="quiz-feedback" role="status"></p>
        </div>
      </form>
    </div>`;
}

function dailyQuiz() {
  return `<section class="quiz-panel extra" id="quiz-panel" aria-labelledby="quiz-title">${quizContent()}</section>`;
}

function checkQuiz(event) {
  event.preventDefault();
  const answer = new FormData(event.currentTarget).get('answer');
  const courseIndex = state.selected;
  if (answer === null || state.quizReview.has(courseIndex)) return;
  const set = quizSets[courseIndex];
  const count = state.quizAnswered.get(courseIndex) || 0;
  const quiz = set[count];
  if (!quiz) return;
  if (Number(answer) !== quiz.correct) {
    document.querySelector('#quiz-feedback').textContent = '다시 한 번 생각해 보세요.';
    return;
  }

  state.quizAnswered.set(courseIndex,count+1);
  state.quizReview.add(courseIndex);
  document.querySelector('#quiz-count').textContent = quizCount();
  const panel = document.querySelector('#quiz-panel');
  panel.innerHTML = quizCelebration(quiz,count+1,set.length,true);
  panel.querySelector('#quiz-title').focus({ preventScroll: true });
  scheduleQuizAdvance(panel);
}

const quizAdvanceDelay = 920;
let quizAdvanceTimer;
let quizAdvanceRevision = 0;

function scheduleQuizAdvance(panel) {
  clearTimeout(quizAdvanceTimer);
  const revision = ++quizAdvanceRevision;
  const courseIndex = state.selected;
  const count = state.quizAnswered.get(courseIndex) || 0;
  if (!panel || state.screen !== 'learn' || state.expanded ||
      !state.quizReview.has(courseIndex) || count >= quizSets[courseIndex].length) {
    return;
  }
  panel.style.setProperty('--quiz-motion-time',`${quizAdvanceDelay}ms`);
  quizAdvanceTimer = setTimeout(() => advanceQuiz(panel,courseIndex,revision),quizAdvanceDelay+100);
}

document.addEventListener('animationend', event => {
  if (event.animationName !== 'quiz-pen-somersault') return;
  const panel = event.target.closest('#quiz-panel');
  const count = state.quizAnswered.get(state.selected) || 0;
  if (!panel || !state.quizReview.has(state.selected) || count >= quizSets[state.selected].length) return;
  advanceQuiz(panel,state.selected,quizAdvanceRevision);
});

function advanceQuiz(panel, courseIndex, revision) {
  if (revision !== quizAdvanceRevision || !panel.isConnected ||
      state.selected !== courseIndex || state.screen !== 'learn' || state.expanded) return;
  clearTimeout(quizAdvanceTimer);
  quizAdvanceRevision++;
  const focusWasInQuiz = panel.contains(document.activeElement);
  state.quizReview.delete(courseIndex);
  panel.innerHTML = quizContent(true);
  if (focusWasInQuiz) panel.querySelector('#quiz-question').focus({ preventScroll: true });
}

function toggleList() {
  state.expanded = !state.expanded;
  document.querySelector('#courseFilter').hidden = !state.expanded;
  document.querySelector('#coursePanel').hidden = !state.expanded;
  document.querySelector('#learningBottom').hidden = state.expanded;
  scheduleQuizAdvance(app.querySelector?.('#quiz-panel'));
  const toggle = document.querySelector('#courseToggle');
  toggle.textContent = state.expanded ? '−' : '+';
  toggle.setAttribute('aria-expanded', state.expanded);
  toggle.setAttribute('aria-label', state.expanded ? '강의 목록 접기' : '강의 목록 펼치기');
}

function filterCourses(index) {
  const previous = subjects.indexOf(state.subject);
  document.querySelector(`[data-filter="${previous}"]`).setAttribute('aria-pressed', 'false');
  state.subject = subjects[index];
  document.querySelector(`[data-filter="${index}"]`).setAttribute('aria-pressed', 'true');
  const results = document.querySelector('#courseResults');
  results.innerHTML = courseResults();
  mountModels(results);
}

function selectCourse(index) {
  if (state.selected === index) return;
  state.selected = index;
  state.book = false;
  state.page = 1;
}

function chooseBook(index) {
  selectCourse(index);
  state.expanded = false;
  render();
  document.querySelector('#courseToggle').focus();
}

function openCourse(index) {
  selectCourse(index);
  state.expanded = false;
  go('player');
}

function canEmbedExample() {

let youtubeApiRequest;
let videoSession;

function loadYouTubeApi() {
  if (window.YT?.Player) return Promise.resolve(window.YT);
  if (!youtubeApiRequest) {
    youtubeApiRequest = new Promise((resolve,reject) => {
      const script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.async = true;
      let timeout;
      const release = () => {
        clearTimeout(timeout);
        if (window.onYouTubeIframeAPIReady === ready) delete window.onYouTubeIframeAPIReady;
      };
      const ready = () => {
        release();
        resolve(window.YT);
      };
      const fail = () => {
        release();
        script.remove();
        reject(new Error('YouTube IFrame API unavailable'));
      };
      window.onYouTubeIframeAPIReady = ready;
      script.onerror = fail;
      timeout = setTimeout(fail,10000);
      document.head.append(script);
    }).catch(error => {
      youtubeApiRequest = undefined;
      throw error;
    });
  }
  return youtubeApiRequest;
}

function setVideoSyncStatus(text) {
  const status = document.querySelector('#video-sync-status');
  if (status && status.textContent !== text) status.textContent = text;
}

function syncBookToVideo(session) {
  if (videoSession !== session || !session.ready || !state.book) return;
  const duration = session.player.getDuration();
  const time = session.player.getCurrentTime();
  // Ignore ad clips and transient zeroes while the full lesson is interrupted.
  const videoUrl = session.player.getVideoUrl?.();
  if (!Number.isFinite(duration) || duration < 1200 || !Number.isFinite(time) || time < 0 ||
      (videoUrl && !videoUrl.includes(exampleVideo.id))) return;
  session.contentDuration ??= duration;
  if (Math.abs(duration-session.contentDuration) > 2 ||
      (session.cuePage > 1 && time <= .25)) return;

  const progress = time/session.contentDuration;
  let page = 1;
  for (let i = 1; i < exampleBook.length; i++) {
    if (progress >= exampleBook[i].startAt) page = i+1;
  }
  if (page === session.cuePage) return;
  session.cuePage = page;
  if (state.page === page) return;
  state.page = page;
  if (state.book) updatePlayerBook();
}

function stopBookTracking(session) {
  clearInterval(session.timer);
  session.timer = undefined;
  session.cuePage = undefined;
}

function refreshBookTracking(session = videoSession) {
  if (!session?.ready) return;
  if (!state.book) {
    stopBookTracking(session);
    setVideoSyncStatus('책을 펼치면 영상과 교재가 연동됩니다.');
    return;
  }
  setVideoSyncStatus('재생 위치에 맞춰 교재가 넘어갑니다.');
  syncBookToVideo(session);
  if (session.timer === undefined) {
    session.timer = setInterval(() => syncBookToVideo(session),400);
  }
}

async function loadExampleVideo() {
  if (!canEmbedExample() || videoSession) return;
  const stage = document.querySelector('#stage');
  const session = { stage, player: null, timer: undefined, ready: false, cuePage: undefined };
  videoSession = session;
  setVideoSyncStatus('YouTube 재생 위치 연결 중');
  const origin = encodeURIComponent(window.location.origin);
  stage.innerHTML = `<iframe class="example-iframe"
    src="https://www.youtube-nocookie.com/embed/${exampleVideo.id}?autoplay=1&playsinline=1&enablejsapi=1&origin=${origin}"
    title="밥 로스 · ${exampleVideo.title}" referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  const frame = stage.querySelector('iframe');
  frame.focus({ preventScroll: true });
  try {
    const YT = await loadYouTubeApi();
    if (videoSession !== session || !stage.isConnected) return;
    session.player = new YT.Player(frame,{
      events: {
        onReady: event => {
          if (videoSession !== session) return;
          session.player = event.target;
          session.ready = true;
          refreshBookTracking(session);
        },
        onStateChange: () => syncBookToVideo(session),
        onError: () => {
          if (videoSession !== session) return;
          stopBookTracking(session);
          session.ready = false;
          setVideoSyncStatus('내장 재생에 실패했어요. YouTube 원본을 열어 주세요.');
        }
      }
    });
  } catch {
    if (videoSession === session) {
      setVideoSyncStatus('교재 자동 전환에 연결하지 못했어요. 페이지는 직접 넘길 수 있어요.');
    }
  }
}

function disposeExampleVideo() {
  const session = videoSession;
  if (!session) return;
  videoSession = undefined;
  stopBookTracking(session);

// Models are built from faces with x, y and z coordinates. The canvas
// projects those faces and sorts them from back to front on every turn.
const rectangle = (x, y, width, height) => [[x,y], [x+width,y], [x+width,y+height], [x,y+height]];
const ellipse = (rx, ry) => Array.from({ length: 32 }, (_, i) => {
  const a = i * Math.PI / 16;
  return [rx * Math.cos(a), ry * Math.sin(a)];
});
const magnet = [[-34,-28],[-19,-28],[-19,8],[-15,16],[-7,20],[7,20],[15,16],[19,8],
  [19,-28],[34,-28],[34,10],[29,24],[19,33],[8,37],[-8,37],[-19,33],[-29,24],[-34,10]];
const speech = [[-29,-17],[-24,-23],[20,-23],[28,-17],[28,11],[22,17],
  [-10,17],[-24,27],[-22,17],[-29,10]];
const shift = (shape, x, y) => shape.map(([px,py]) => [px+x,py+y]);
const solid = (shape, z, depth, hue, bevel = .92) => ({ shape, z, depth, hue, bevel });

const models = {
  book: [
    solid(rectangle(-32,-42,59,81),-9,3,75,.98),
    solid(rectangle(-30,-40,55,76),-6,13,224,.98),
    ...[-4,-1,2,5].map(z => solid(rectangle(21,-38,4,73),z,.5,166,.99)),
    solid(rectangle(-32,-42,59,81),7,4,90,.98),
    solid(rectangle(-32,-42,9,81),-9,20,57,.96),
    solid(rectangle(-16,-24,31,3),11,1,218),
    solid(rectangle(-16,-17,22,2),11,1,179),
    solid(shift(ellipse(12,12),2,10),11,1,180)
  ],
  math: [
    solid(ellipse(30,30),-9,18,171),
    solid([[-24,11],[-24,7],[21,-12],[24,-8]],9,2,63),
    solid(ellipse(5,5),9,2,75)
  ],
  english: [
    solid(shift(speech,9,12),-9,9,94),
    solid(shift(speech,-5,-7),0,10,204),
    ...[-17,-6,5].map(x => solid(shift(ellipse(3,3),x,-9),10,1,78))
  ],
  science: [
    solid(magnet,-9,18,109),
    solid(rectangle(-34,-28,15,12),9,1,206),
    solid(rectangle(19,-28,15,12),9,1,206)
  ]
};
const modelViews = new WeakMap();

function facesFor(part) {
  const { shape, z, depth, hue, bevel } = part;
  const ring = (position, scale) => shape.map(([x,y]) => [x*scale,y*scale,z+depth*position]);
  const rings = [ring(0,bevel),ring(.25,1),ring(.75,1),ring(1,bevel)];
  const faces = [
    { points: rings[0], hue: hue*.65 },
    { points: rings.at(-1), hue, front: true }
  ];
  for (let level = 0; level < rings.length - 1; level++) {
    const current = rings[level];
    const next = rings[level+1];
    for (let i = 0; i < current.length; i++) {
      const j = (i+1) % current.length;
      const angle = i * 2 * Math.PI / current.length;
      faces.push({ points: [current[i],current[j],next[j],next[i]], hue: hue*(.65+.19*Math.cos(angle-1)) });
    }
  }
  return faces;
}

function drawModel(host, tiltX = 0, tiltY = 0) {
  const view = modelViews.get(host);
  if (!view) return;
  const { ctx, faces, type } = view;
  const ax = -.11 + tiltX;
  const ay = -.44 + tiltY;
  const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
  const project = ([x,y,z]) => {
    const horizontal = x*cy + z*sy;
    const depth = z*cy - x*sy;
    const vertical = y*cx - depth*sx;
    const rotatedZ = y*sx + depth*cx;
    const scale = 225 / (225 - rotatedZ);
    return [60+horizontal*scale, 59+vertical*scale, rotatedZ];
  };
  const projected = faces.map(face => {
    const points = face.points.map(project);
    return { ...face, points, depth: points.reduce((sum, p) => sum+p[2], 0)/points.length };
  }).sort((a,b) => a.depth-b.depth);

  ctx.clearRect(0,0,120,120);
  for (const { points, hue, front } of projected) {
    ctx.beginPath();
    points.forEach(([x,y], i) => i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
    ctx.closePath();
    const gray = value => {
      const channel = Math.min(255,Math.round(value));
      return `rgb(${channel},${channel},${channel})`;
    };
    if (front) {
      const light = ctx.createLinearGradient(29,21,87,104);
      light.addColorStop(0,gray(hue*1.36));
      light.addColorStop(.52,gray(hue));
      light.addColorStop(1,gray(hue*.73));
      ctx.fillStyle = light;
    } else {
      ctx.fillStyle = gray(hue);
    }
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = .55;
    ctx.stroke();
    ctx.fill();
  }
  if (type === 'book' && ay > -1.1 && ay < .85) {
    const [x,y] = project([-15,1,12]);
    ctx.font = 'bold 9px sans-serif';
    ctx.fillStyle = '#ededed';
    ctx.fillText(host.dataset.cover || '중학',x,y);
  }
}

function mountModels(root) {
  root.querySelectorAll?.('[data-model]').forEach(host => {
    const type = host.dataset.model;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 240;
    canvas.setAttribute('aria-hidden','true');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.scale(2,2);
    const faces = models[type].flatMap(facesFor);
    modelViews.set(host,{ ctx, type, faces });
    host.classList.add('mesh-host');
    host.append(canvas);
    drawModel(host);
  });
}

let audioContext;
let flameDrag;
let tiltedAsset;
const fallingFlames = new WeakSet();
const flamePoses = new WeakMap();
const flamePreviews = new WeakMap();
const handledOnRelease = new WeakSet();

function prepareFlameSound() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  try {
    audioContext ??= new AudioContext();
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch {
    // The visual interaction still works without audio.
  }
}

function playFlameImpact() {
  if (audioContext?.state !== 'running') return;
  const now = audioContext.currentTime;
  const partials = [
    [790, .07, .22], [1268, .035, .16], [2053, .023, .09], [3247, .012, .044]
  ];
  for (const [frequency, volume, decay] of partials) {
    const tone = audioContext.createOscillator();
    const envelope = audioContext.createGain();
    tone.frequency.value = frequency;
    envelope.gain.setValueAtTime(.0001, now);
    envelope.gain.exponentialRampToValueAtTime(volume, now + .002);
    envelope.gain.exponentialRampToValueAtTime(.0001, now + decay);
    tone.connect(envelope).connect(audioContext.destination);
    tone.start(now);
    tone.stop(now + decay + .01);
  }
}

function easeProgress(value) {
  const clamped = Math.max(0,Math.min(1,value));
  return clamped*clamped*(3-2*clamped);
}

function updateFlameIllustration(flame,{ shell, ember, bend = 0, ripple = 0 }) {
  if (shell !== undefined) flame.style.setProperty('--shell-heat',shell);
  if (ember !== undefined) flame.style.setProperty('--ember-heat',ember);
  flame.style.setProperty('--flame-tip-bend',`${bend*6}deg`);
  flame.style.setProperty('--flame-tip-stretch',1+ripple*.045);
}

function playStreakIgnition() {
  if (!state.ignitePending || state.screen !== 'learn' || state.expanded) return;
  const callout = app.querySelector?.('.streak-callout');
  const counter = app.querySelector?.('#streak-days');
  if (!callout || !counter) return;
  state.ignitePending = false;

  const art = callout.querySelector('.streak-art');
  const flame = art.querySelector('.streak-flame');
  callout.setAttribute('data-igniting','');
  counter.innerHTML = '<span class="streak-roll" aria-hidden="true"><span class="streak-roll-window"><span class="streak-roll-wheel"><span>0</span><span>1</span></span></span>일</span>';
  const wheel = counter.querySelector('.streak-roll-wheel');
  updateFlameIllustration(flame,{ shell: 0, ember: 0 });
  art.style.setProperty('--flame-glow','0');
  let start;
  function ignite(now) {
    if (!callout.isConnected) return;
    start ??= now;
    const elapsed = now-start;
    const ember = easeProgress(elapsed/320);
    const shell = easeProgress((elapsed-180)/490);
    const roll = easeProgress((elapsed-580)/400);
    const ripple = Math.sin(Math.PI*shell)*.85;
    updateFlameIllustration(flame,{ shell, ember, ripple });
    art.style.setProperty('--flame-glow',String(shell));
    wheel.style.setProperty('--day-roll',`${-50*roll}%`);
    if (elapsed < 980) {
      requestAnimationFrame(ignite);
    } else {
      callout.removeAttribute('data-igniting');
      art.style.removeProperty('--flame-glow');
      counter.textContent = '1일';
    }
  }
  requestAnimationFrame(ignite);
}

function easeFlamePose(art, pitch, yaw) {
  let pose = flamePoses.get(art);
  if (!pose) {
    pose = { x: 0, y: 0, targetX: 0, targetY: 0, frame: null };
    flamePoses.set(art, pose);
  }
  pose.targetX = pitch;
  pose.targetY = yaw;
  if (pose.frame !== null) return;
  const flame = art.querySelector('.streak-flame');
  function step() {
    pose.frame = null;
    if (!art.isConnected) return;
    pose.x += (pose.targetX - pose.x) * .29;
    pose.y += (pose.targetY - pose.y) * .29;
    const settled = Math.abs(pose.targetX - pose.x) < .003 && Math.abs(pose.targetY - pose.y) < .003;
    if (settled) {
      pose.x = pose.targetX;
      pose.y = pose.targetY;
    }
    if (!art.closest('[data-igniting]')) updateFlameIllustration(flame,{ bend: pose.y, ripple: pose.x });
    if (!settled) pose.frame = requestAnimationFrame(step);
  }
  pose.frame = requestAnimationFrame(step);
}

function clearTilt() {
  if (!tiltedAsset) return;
  for (const property of ['--tilt-x', '--tilt-y', '--sway']) {
    tiltedAsset.style.removeProperty(property);
  }
  if (tiltedAsset.matches('.streak-art')) easeFlamePose(tiltedAsset, 0, 0);
  else drawModel(tiltedAsset);
  tiltedAsset = null;
}

function trackAsset(event) {
  if (flameDrag && flameDrag.id === event.pointerId) {
    flameDrag.lift = Math.max(0, Math.min(55, flameDrag.startY - event.clientY));
    flameDrag.art.style.setProperty('--lift', `-${flameDrag.lift}px`);
    return;
  }
  if (event.pointerType === 'touch') return;
  const flame = event.target.closest('.streak-art');
  const card = event.target.closest('.lecture-card');
  const asset = flame || card?.querySelector('.course-art');
  if (asset !== tiltedAsset) clearTilt();
  if (!asset || fallingFlames.has(asset) || flame?.closest('[data-igniting]')) return;
  tiltedAsset = asset;
  const bounds = (flame || card).getBoundingClientRect();
  const x = (event.clientX - bounds.left) / bounds.width - .5;
  const y = (event.clientY - bounds.top) / bounds.height - .5;
  if (flame) {
    easeFlamePose(flame, .5-y*.24, x*1.5);
  } else {
    asset.style.setProperty('--tilt-x', `${-y * 22}deg`);
    asset.style.setProperty('--tilt-y', `${x * 27}deg`);
    drawModel(asset, -y*.6, x*1.35);
  }
}

function showFlameHover(event) {
  if (event.pointerType !== 'touch') event.currentTarget.setAttribute('data-hovering','');
}

function activateFlame(art) {
  if (!handledOnRelease.delete(art)) previewFlame(art);
}

function previewFlame(art) {
  const callout = art.closest('.streak-callout');
  if (!callout || fallingFlames.has(art) || callout.hasAttribute('data-igniting')) return;
  flamePreviews.get(art)?.cancel();
  const status = callout.querySelector('.streak-hint');
  const body = art.querySelector('.flame-body');
  const hint = status.textContent;
  const duration = 620;
  art.setAttribute('data-previewing','');
  status.textContent = '불꽃이 움직이는 중';
  body.style.transform = 'translateY(-8px)';

  let startedAt;
  let request;
  function stop() {
    cancelAnimationFrame(request);
    flamePreviews.delete(art);
    art.removeAttribute('data-previewing');
    body.style.removeProperty('transform');
    status.textContent = hint;
  }
  function tick(now) {
    if (!art.isConnected) {
      stop();
      return;
    }
    startedAt ??= now;
    const progress = (now-startedAt)/duration;
    if (progress >= 1) {
      stop();
      return;
    }
    const hop = Math.sin(Math.PI*progress) ** 1.3;
    body.style.transform = `translateY(${-21*hop}px) rotate(${-5*hop}deg)`;
    request = requestAnimationFrame(tick);
  }
  flamePreviews.set(art,{ cancel: stop });
  request = requestAnimationFrame(tick);
}

async function dropFlame(art, lift) {
  const body = art.querySelector('.flame-body');
  art.style.removeProperty('--lift');
  if (lift < 6) return;
  if (!body.animate) {
    playFlameImpact();
    return;
  }
  fallingFlames.add(art);
  art.setAttribute('data-falling', '');
  try {
    await body.animate(
      [{ transform: `translateY(-${lift}px)` }, { transform: 'translateY(0)' }],
      { duration: 110 + lift * 1.4, easing: 'cubic-bezier(.55,.04,.92,.58)' }
    ).finished;
    if (!art.isConnected) return;
    playFlameImpact();
    await body.animate(
      [{ transform: 'scale(1.04,.95)' }, { transform: 'translateY(-2px) rotate(-2deg)' }, { transform: 'none' }],
      { duration: 245, easing: 'ease-out' }
    ).finished;
  } finally {
    art.removeAttribute('data-falling');
    fallingFlames.delete(art);
  }
}

document.addEventListener('pointerdown', event => {
  if (event.button !== 0 || flameDrag) return;
  const art = event.target.closest('.streak-callout[data-lit="false"] .streak-art');
  if (!art || fallingFlames.has(art)) return;
  handledOnRelease.delete(art);
  flamePreviews.get(art)?.cancel();
  prepareFlameSound();
  clearTilt();
  art.focus({ preventScroll: true });
  art.setPointerCapture(event.pointerId);
  art.setAttribute('data-grabbing', '');
  flameDrag = { id: event.pointerId, art, startY: event.clientY, lift: 0 };
});
document.addEventListener('pointerover', event => {
  if (!flameDrag && event.target.closest('.streak-art')) trackAsset(event);
});
document.addEventListener('pointermove', trackAsset);
document.addEventListener('pointerout', event => {
  if (!event.relatedTarget || (tiltedAsset?.matches('.streak-art') && !tiltedAsset.contains(event.relatedTarget))) clearTilt();
});
function endFlameDrag(event) {
  if (!flameDrag || flameDrag.id !== event.pointerId) return;
  const { art, lift } = flameDrag;
  flameDrag = null;
  art.removeAttribute('data-grabbing');
  if (event.type !== 'pointerup') {
    art.style.removeProperty('--lift');
    return;
  }
  handledOnRelease.add(art);
  setTimeout(() => handledOnRelease.delete(art),0);
  if (lift >= 6) {
    dropFlame(art, lift).catch(() => {});
  } else {
    art.style.removeProperty('--lift');
    previewFlame(art);
  }
}
document.addEventListener('pointerup', endFlameDrag);
document.addEventListener('pointercancel', endFlameDrag);
document.addEventListener('lostpointercapture', endFlameDrag);

document.addEventListener('keydown',e=>{
  if (e.key === 'Escape' && state.screen === 'learn' && state.expanded) {
    toggleList();
    document.querySelector('#courseToggle').focus();
  }
  if(!modal.firstChild)return;if(e.key==='Tab'){e.preventDefault();document.querySelector('#return').focus()}});
render();
</script>
